databaseChangeLog:

  - changeSet:
      id: 007-create-time-entry-audit
      author: zodiakk

      changes:
        - createTable:
            tableName: time_entry_audit
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: time_entry_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: actor_employee_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: changes
                  type: JSONB
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
