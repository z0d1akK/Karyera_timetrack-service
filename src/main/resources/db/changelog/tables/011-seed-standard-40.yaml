databaseChangeLog:
  - changeSet:
      id: 011-seed-standard-40
      author: zodiakk
      comment: Default five-day 40-hour schedule
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM work_schedules WHERE code = 'STANDARD_40'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              INSERT INTO work_schedules (id, code, name, description, timezone, active, version, created_at, updated_at)
              VALUES (
                  '55555555-5555-4555-8555-555555555555',
