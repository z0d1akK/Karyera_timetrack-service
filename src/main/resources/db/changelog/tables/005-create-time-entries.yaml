databaseChangeLog:

  - changeSet:
      id: 005-create-time-entries
      author: zodiakk

      changes:
        - createTable:
            tableName: time_entries
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: project_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: task_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: project_assignment_id
                  type: UUID
              - column:
                  name: work_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: duration_minutes
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: timesheet_id
                  type: UUID
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: UUID
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: time_entries
            baseColumnNames: timesheet_id
            referencedTableName: timesheets
            referencedColumnNames: id
            constraintName: fk_time_entry_timesheet

        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE time_entries ADD CONSTRAINT chk_time_entry_duration CHECK (duration_minutes > 0 AND duration_minutes <= 1440);
