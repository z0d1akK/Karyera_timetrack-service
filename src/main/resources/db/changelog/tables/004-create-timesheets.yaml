databaseChangeLog:

  - changeSet:
      id: 004-create-timesheets
      author: zodiakk

      changes:
        - createTable:
            tableName: timesheets
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: period_start
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: period_end
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(25)
                  constraints:
                    nullable: false
              - column:
                  name: planned_minutes
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: submitted_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: approved_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: approved_by
                  type: UUID
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: timesheets
            columnNames: employee_id, period_start
            constraintName: uq_timesheet_employee_week

        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE timesheets ADD CONSTRAINT chk_timesheet_period CHECK (period_end = period_start + 6);
              ALTER TABLE timesheets ADD CONSTRAINT chk_timesheet_week_start CHECK (EXTRACT(ISODOW FROM period_start) = 1);
              ALTER TABLE timesheets ADD CONSTRAINT chk_timesheet_planned_minutes CHECK (planned_minutes >= 0);
