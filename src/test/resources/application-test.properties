spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

internal.api-key=test-internal-api-key

services.employee.url=http://localhost:8092
services.project.url=http://localhost:8093

app.outbox.poll-delay-ms=3600000
app.housekeeping.cron=0 0 3 * * *

logging.level.com.zodiakk.timetrackservice=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.hibernate.SQL=WARN

testcontainers.reuse.enable=false
